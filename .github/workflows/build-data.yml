# Optional: when you edit data-src/*.txt on GitHub (even from your phone), this rebuilds data/*.json for you.
name: Rebuild data
on:
  push:
    paths:
      - 'data-src/**'
      - 'tools/build.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: Commit rebuilt data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Rebuild data JSON" && git push)
